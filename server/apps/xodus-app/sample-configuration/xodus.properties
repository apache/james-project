# ==============================================================================
# Xodus Database Configuration (Tuned for 8 vCPU, 8 GB RAM, Low SSD Wear)
# ==============================================================================
# Path to store Xodus environment data and entities (relative to basedir or absolute)
xodus.path=var/xodus

# Environmental GC and cache tuning
# Memory percentage to allocate for entity iterable cache (1-99, default: 50)
xodus.entityStore.cacheMemoryPercentage=50

# Log sync period in milliseconds
# 2000 ms balances safety and flash memory longevity by aggregating writes into sequential blocks,
# dramatically reducing SSD write amplification and Wear Leveling exhaustion.
xodus.log.syncPeriod=2000

# Background Garbage Collector enable flag (default: true)
xodus.gc.enabled=true

# Periodic in-place BLOB deduplication interval in days (Format V2 refactoring, default: 7)
# Automatically collapses identical in-place blobs into reference handles before background GC runs.
xodus.entityStore.refactoring.deduplicateBlobsEveryDays=7

# Minimum size in bytes of in-place blobs eligible for deduplication (default: 4096 / 4 KB).
# Matches the standard 4 KB filesystem cluster/OS page boundary to eliminate hash-table bloat
# and prevent metadata tracking overhead on tiny fragments (< 4 KB).
xodus.entityStore.refactoring.deduplicateBlobsMinSize=4096

# ==============================================================================
# Universal Storage Profile (Optimized for HDD Sequential I/O & SSD/NVMe Wear Reduction)
# ==============================================================================
# Append-only log file size in KB (default: 16384 KB = 16 MB).
# Writing large continuous chunks guarantees long sequential tracks on magnetic HDDs
# (minimizing mechanical arm seek time) while reducing VFS descriptor churn on SSDs.
xodus.log.fileSize=16384

# Log cache page size in bytes (default: 65536 = 64 KB).
# Optimally leverages OS and disk controller read-ahead buffers for sequential read sweeps.
xodus.log.cache.pageSize=65536

# Minimum age in files for the background Garbage Collector to consider an .xd file (default: 8).
# Gives short-lived transient updates (flags, deletions) time to settle, preventing
# mechanical HDD head-thrashing between active write tails and background GC reads.
xodus.gc.fileMinAge=8

# Minimum percentage of raw data utilization before GC starts reclaiming space (default: 35).
# Ensures smooth, continuous background reclamation rather than disruptive emergency spikes.
xodus.gc.minUtilization=35



# GC run period in milliseconds. Default Xodus value is 5000ms (5s).
# Under heavy SMTP load (300+ msgs/sec), frequent GC cycles compete with write transactions.
# 30000ms (30s) allows GC to breathe between cycles without stalling ingestion.
# Range: 5000 (aggressive) to 60000 (passive). Tune based on disk I/O metrics.
xodus.gc.runPeriod=30000

# Maximum number of .xd log files kept open by Xodus LogCache. Default is 500.
# At logFileSize=16MB, a 1TB mail store produces ~65000 .xd files.
# 2000 open files dramatically reduces OS open()/close() syscalls during IMAP FETCH.
# Requires ulimit -n >= 65535 (see OS Tuning section in README).
xodus.log.cache.openFilesCount=2000
