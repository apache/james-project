broker.uri=pulsar://pulsar:6650
admin.uri=http://pulsar:8080
authentication.type=no-auth
#authentication.basic.userId=userId
#authentication.basic.password=password
namespace=pulsar/system
# TLS (pulsar+ssl:// and https:// URIs): the host name of the broker and admin endpoints is checked against their
# certificate, true by default. Set to false only for tests.
#tls.hostname.verification=true
# Certificates trusted for these endpoints, in PEM. The JVM trust store is used by default.
#tls.trust.certs.file.path=/root/conf/pulsar-ca.pem
