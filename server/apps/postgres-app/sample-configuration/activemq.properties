# ==============================================================================
# Apache ActiveMQ Artemis Embedded Queue Configuration
# ==============================================================================
# Controls persistence, journal I/O batching, and client interaction for the
# embedded Artemis broker backing James mail queues (spool, outgoing, etc.).
# ==============================================================================

# Transactional journal sync (true = full ACID durability / Zero Data Loss)
# Messages are guaranteed to be flushed to persistent storage upon commit.
artemis.journal.sync.transactional=true

# Non-transactional journal sync (avoid redundant fsync for non-critical metadata)
artemis.journal.sync.non.transactional=false

# High-precision journal group commit timeout in nanoseconds (NIO).
# 1,500,000 ns = 1.5 ms. Coalesces concurrent writes across parallel threads
# into a single physical disk flush, drastically reducing disk latency spikes.
artemis.journal.buffer.timeout.nio=1500000

# Write buffer size for journal NIO operations (default: 1 MB)
artemis.journal.buffer.size.nio=1048576

# Maximum concurrent direct/NIO write operations allowed
artemis.journal.max.io.nio=500

# Enables asynchronous non-blocking connection execution inside Artemis engine
artemis.async.connection.execution=true

# JMS Client Connection Factory optimization
# Delegates persistence waiting directly to the optimized journal engine
artemis.client.block.on.durable.send=false
artemis.client.block.on.acknowledge=false
