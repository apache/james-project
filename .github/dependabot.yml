version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[BUILD]"
    groups:
      # Netty, and the libraries shipping their own Netty-based transport, need to be upgraded
      # together so that a single Netty version is resolved at runtime.
      netty-stack:
        patterns:
          - "io.netty*"
          - "software.amazon.awssdk*"
          - "org.apache.cassandra*"
          - "io.projectreactor*"
          - "io.lettuce*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
      logging:
        patterns:
          - "org.slf4j*"
          - "ch.qos.logback*"
          - "org.apache.logging.log4j*"
      scala:
        patterns:
          - "org.scala-lang*"
      circe:
        patterns:
          - "io.circe*"
      pekko:
        patterns:
          - "org.apache.pekko*"
      lucene:
        patterns:
          - "org.apache.lucene*"
      artemis:
        patterns:
          - "org.apache.artemis*"
      angus-mail:
        patterns:
          - "org.eclipse.angus*"
      bouncycastle:
        patterns:
          - "org.bouncycastle*"
      micrometer:
        patterns:
          - "io.micrometer*"
      metrics:
        patterns:
          - "io.dropwizard.metrics*"
      spring:
        patterns:
          - "org.springframework*"
      feign:
        patterns:
          - "io.github.openfeign*"
      jjwt:
        patterns:
          - "io.jsonwebtoken*"
      test-frameworks:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "io.cucumber*"
          - "org.mockito*"
          - "org.assertj*"
      maven-plugins:
        patterns:
          - "org.apache.maven*"
          - "org.codehaus.mojo*"
